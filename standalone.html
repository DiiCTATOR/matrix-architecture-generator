// ─── LAYOUT ENGINE ────────────────────────────────────────────────
const NW = 116, NH = 108, HGAP = 80, VGAP = 60, PAD = 56;

function layoutNodes(nodes, connections) {
  if (!nodes.length) return { pos:{}, svgW:800, svgH:500 };
  const ids = nodes.map(n => n.id);
  const inEdges = {};
  ids.forEach(id => (inEdges[id] = []));
  connections.forEach(c => { if (inEdges[c.to]) inEdges[c.to].push(c.from); });
  const layer = {};
  ids.forEach(id => { if (!inEdges[id].length) layer[id] = 0; });
  let changed = true;
  while (changed) {
    changed = false;
    connections.forEach(c => {
      if (layer[c.from] !== undefined) {
        const nxt = layer[c.from] + 1;
        if (layer[c.to] === undefined || layer[c.to] < nxt) { layer[c.to] = nxt; changed = true; }
      }
    });
  }
  ids.forEach(id => { if (layer[id] === undefined) layer[id] = 0; });
  const cols = {};
  ids.forEach(id => { const l = layer[id]; if (!cols[l]) cols[l] = []; cols[l].push(id); });
  const colKeys = Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const pos = {};
  colKeys.forEach((ck, ci) => {
    cols[ck].forEach((id, ri) => {
      const node = nodes.find(n => n.id === id);
      pos[id] = { ...node, x: PAD + ci*(NW+HGAP), y: PAD + ri*(NH+VGAP), w: NW, h: NH };
    });
  });
  const vals = Object.values(pos);
  return {
    pos,
    svgW: Math.max(...vals.map(n=>n.x+n.w)) + PAD,
    svgH: Math.max(...vals.map(n=>n.y+n.h)) + PAD,
  };
}

// ─── ROUTING ─────────────────────────────────────────────────────
function route(from, to) {
  const fCx=from.x+from.w/2, fCy=from.y+from.h/2;
  const tCx=to.x+to.w/2, tCy=to.y+to.h/2;
  const dx=tCx-fCx, dy=tCy-fCy;
  let fx,fy,tx,ty;
  if (Math.abs(dx) >= Math.abs(dy)) {
    if (dx>0){fx=from.x+from.w;fy=fCy;tx=to.x;ty=tCy;}
    else{fx=from.x;fy=fCy;tx=to.x+to.w;ty=tCy;}
  } else {
    if (dy>0){fx=fCx;fy=from.y+from.h;tx=tCx;ty=to.y;}
    else{fx=fCx;fy=from.y;tx=tCx;ty=to.y+to.h;}
  }
  const isH=Math.abs(dx)>=Math.abs(dy);
  let d;
  if (isH){const mx=(fx+tx)/2;d=`M${fx},${fy} C${mx},${fy} ${mx},${ty} ${tx},${ty}`;}
  else{const my=(fy+ty)/2;d=`M${fx},${fy} C${fx},${my} ${tx},${my} ${tx},${ty}`;}
  return { d, lx:(fx+tx)/2, ly:(fy+ty)/2 };
}

// ─── DIAGRAM CANVAS ──────────────────────────────────────────────
function DiagramCanvas({ diagram, zoom, pan }) {
  if (!diagram) return null;
  const { nodes=[], connections=[], groups=[] } = diagram;
  const { pos, svgW, svgH } = layoutNodes(nodes, connections);

  return (
    <svg
      width={svgW} height={svgH}
      viewBox={`0 0 ${svgW} ${svgH}`}
      style={{ display:"block", fontFamily:"Inter,sans-serif", overflow:"visible" }}
    >
      <defs>
        <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L0,8 L10,4 z" fill="#ffffff"/>
        </marker>
        <marker id="arr-dim" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L0,8 L10,4 z" fill="#6b7280"/>
        </marker>
        <filter id="card-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="8" floodColor="#000" floodOpacity="0.6"/>
        </filter>
        <filter id="group-glow">
          <feDropShadow dx="0" dy="2" stdDeviation="4" floodColor="#000" floodOpacity="0.4"/>
        </filter>
      </defs>

      {/* Groups / swimlanes */}
      {groups.map(grp => {
        const members = Object.values(pos).filter(n=>n.group===grp.id||n.group===grp.label);
        if (!members.length) return null;
        const x1=Math.min(...members.map(n=>n.x))-24, y1=Math.min(...members.map(n=>n.y))-46;
        const x2=Math.max(...members.map(n=>n.x+n.w))+24, y2=Math.max(...members.map(n=>n.y+n.h))+24;
        const W=x2-x1, H=y2-y1;
        const col = grp.color || "#e8850a";
        return (
          <g key={grp.id} filter="url(#group-glow)">
            <rect x={x1} y={y1} width={W} height={H} rx="14"
              fill={`${col}0a`} stroke={col} strokeWidth="1.5"/>
            {/* Header pill */}
            <rect x={x1+12} y={y1-1} width={grp.label.length*7.5+28} height={24} rx="6"
              fill={`${col}22`} stroke={col} strokeWidth="1"/>
            <text x={x1+24} y={y1+15} fontSize="10" fill={col} fontWeight="700"
              letterSpacing=".08em" textTransform="uppercase">{grp.label.toUpperCase()}</text>
          </g>
        );
      })}

      {/* Connections */}
      {connections.map((conn, i) => {
        const f=pos[conn.from], t=pos[conn.to];
        if (!f||!t) return null;
        const { d, lx, ly } = route(f, t);
        const isDim = conn.label?.match(/log|metric|monitor|alarm/i);
        const lw = conn.label ? conn.label.length*6.2+16 : 0;
        return (
          <g key={i}>
            {/* glow */}
            <path d={d} stroke="#fff" strokeWidth="5" fill="none" opacity=".04" strokeLinecap="round"/>
            <path d={d}
              stroke={isDim ? "#4b5563" : "#e5e7eb"}
              strokeWidth={isDim ? 1.5 : 2}
              fill="none" strokeLinecap="round"
              strokeDasharray={isDim ? "6 5" : undefined}
              markerEnd={isDim?"url(#arr-dim)":"url(#arr)"}
            />
            {conn.label && (
              <g>
                <rect x={lx-lw/2} y={ly-11} width={lw} height={18} rx="5"
                  fill="#1a1d27" stroke="#374151" strokeWidth="1"/>
                <text x={lx} y={ly+3} fontSize="9" fill="#9ca3af" textAnchor="middle" fontWeight="500"
                  fontFamily="JetBrains Mono,monospace">{conn.label}</text>
              </g>
            )}
          </g>
        );
      })}

      {/* Nodes */}
      {Object.values(pos).map(node => {
        const svc = SERVICES[node.service] || SERVICES.EC2;
        const sub = node.label && node.label !== svc.label
          ? (node.label.length>14 ? node.label.slice(0,13)+"…" : node.label) : "";
        return (
          <g key={node.id} filter="url(#card-glow)">
            {/* Card body */}
            <rect x={node.x} y={node.y} width={node.w} height={node.h} rx="12"
              fill="#1e2130" stroke={svc.color} strokeWidth="1.5"/>
            {/* Top accent */}
            <rect x={node.x} y={node.y} width={node.w} height={5} rx="12" fill={svc.color}/>
            <rect x={node.x} y={node.y+3} width={node.w} height={2} fill={svc.color}/>
            {/* Icon */}
            <foreignObject x={node.x+(node.w-42)/2} y={node.y+10} width={42} height={42}>
              <div xmlns="http://www.w3.org/1999/xhtml"
                style={{display:"flex",alignItems:"center",justifyContent:"center",width:"100%",height:"100%"}}>
                <AWSIcon service={node.service} size={42}/>
              </div>
            </foreignObject>
            {/* Label */}
            <text x={node.x+node.w/2} y={node.y+node.h-(sub?20:12)}
              fontSize="9.5" fontWeight="700" fill="#f3f4f6" textAnchor="middle">
              {svc.label}
            </text>
            {sub && (
              <text x={node.x+node.w/2} y={node.y+node.h-7}
                fontSize="8" fill="#6b7280" textAnchor="middle">{sub}</text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

          <div style={{height:40,background:"#13161f",borderBottom:"1px solid #1f2433",display:"flex",alignItems:"center",padding:"0 14px",gap:8,flexShrink:0}}>
            {/* Tool buttons */}
            <div style={{display:"flex",background:"#1e2130",borderRadius:7,padding:2,gap:1}}>
              {[["select","↖ Select"],["pan","✋ Pan"]].map(([id,lbl])=>(
                <button key={id} onClick={()=>setTool(id)}
                  style={{background:tool===id?"#2d3548":"transparent",border:"none",borderRadius:5,color:tool===id?"#f3f4f6":"#6b7280",fontFamily:"inherit",fontSize:10,padding:"4px 10px",cursor:"pointer",transition:"all .15s"}}>
                  {lbl}
                </button>
              ))}
            </div>

            <div style={{width:1,height:20,background:"#1f2433"}}/>

            {/* Zoom */}
            <div style={{display:"flex",alignItems:"center",gap:4}}>
              <button onClick={()=>setZoom(z=>Math.max(.25,z-.1))}
                style={{background:"#1e2130",border:"none",borderRadius:5,color:"#9ca3af",width:24,height:24,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
              <span style={{fontSize:10,color:"#6b7280",minWidth:40,textAlign:"center"}}>{Math.round(zoom*100)}%</span>
              <button onClick={()=>setZoom(z=>Math.min(3,z+.1))}
                style={{background:"#1e2130",border:"none",borderRadius:5,color:"#9ca3af",width:24,height:24,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
              <button onClick={()=>setZoom(1)}
                style={{background:"#1e2130",border:"none",borderRadius:5,color:"#6b7280",fontFamily:"inherit",fontSize:9,padding:"3px 8px",cursor:"pointer"}}>Fit</button>
            </div>

            <div style={{flex:1}}/>

            {/* Stats */}
            {diagram && (
              <div style={{fontSize:9.5,color:"#374151",display:"flex",gap:14}}>
                <span>{diagram.nodes?.length} nodes</span>
                <span>{diagram.connections?.length} connections</span>
                {diagram.groups?.length>0 && <span>{diagram.groups.length} groups</span>}
              </div>
            )}
          </div>

          {/* Canvas area */}
          <div
            ref={canvasRef}
            style={{flex:1,overflow:"auto",position:"relative",cursor:tool==="pan"?"grab":"default"}}
          >
            {/* Dot-grid background */}
            <div style={{position:"absolute",inset:0,backgroundImage:"radial-gradient(circle,#2a2f45 1px,transparent 1px)",backgroundSize:"24px 24px",pointerEvents:"none"}}/>

            {/* Empty state */}
            {!diagram && !loading && (
              <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:20}}>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16,opacity:.08}}>
                  {["EC2","Lambda","S3","RDS","ALB","CloudFront","SQS","DynamoDB"].map(k=>(
                    <AWSIcon key={k} service={k} size={40}/>
                  ))}
                </div>
                <div style={{textAlign:"center",maxWidth:300}}>
                  <div style={{fontSize:18,color:"#1f2433",fontWeight:700,marginBottom:8}}>✦ DiagramGPT</div>
                  <div style={{fontSize:12,color:"#374151",lineHeight:1.8}}>
                    Describe your AWS architecture in plain English and watch it come to life.
                  </div>
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",maxWidth:440}}>
                  {EXAMPLES.slice(0,4).map((ex,i)=>(
                    <button key={i} onClick={()=>{setPrompt(ex.text);generate(ex.text);}}
                      style={{background:"transparent",border:"1px solid #1f2433",borderRadius:20,color:"#4b5563",fontFamily:"inherit",fontSize:10,padding:"5px 14px",cursor:"pointer",transition:"all .15s"}}
                      onMouseEnter={e=>{e.currentTarget.style.borderColor="#374151";e.currentTarget.style.color="#9ca3af";}}
                      onMouseLeave={e=>{e.currentTarget.style.borderColor="#1f2433";e.currentTarget.style.color="#4b5563";}}>
                      {ex.label}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Loading state */}
            {loading && (
              <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
                <div style={{position:"relative",width:56,height:56}}>
                  <div style={{position:"absolute",inset:0,borderRadius:"50%",border:"2px solid #1f2433",borderTop:"2px solid #6366f1",animation:"spin .7s linear infinite"}}/>
                  <div style={{position:"absolute",inset:10,borderRadius:"50%",border:"2px solid #1f2433",borderBottom:"2px solid #4f46e5",animation:"spin 1.1s linear infinite reverse"}}/>
                </div>
                <div style={{fontSize:11,color:"#4b5563",letterSpacing:".06em"}}>Generating architecture…</div>
              </div>
            )}

            {/* Diagram */}
            {diagram && !loading && (
              <div style={{padding:32,transformOrigin:"top left",transform:`scale(${zoom})`,display:"inline-block",minWidth:"100%"}}>
                <DiagramCanvas diagram={diagram} zoom={zoom}/>
              </div>
            )}
          </div>

          {/* Eraser watermark */}
          <div style={{height:28,background:"#13161f",borderTop:"1px solid #1f2433",display:"flex",alignItems:"center",justifyContent:"flex-end",padding:"0 14px",gap:6,flexShrink:0}}>
            <EraserLogo/>
            <span style={{fontSize:11,fontWeight:700,color:"#374151",letterSpacing:"-.01em"}}>eraser</span>
            <span style={{fontSize:10,color:"#1f2433"}}>·</span>
            <span style={{fontSize:10,color:"#374151"}}>DiagramGPT</span>
          </div>
        </div>
      </div>

      <style>{`
        @keyframes spin { to { transform:rotate(360deg) } }
        * { box-sizing:border-box; }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:#0f1117; }
        ::-webkit-scrollbar-thumb { background:#1f2433; border-radius:8px; }
        ::-webkit-scrollbar-thumb:hover { background:#2d3548; }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(React.StrictMode, null, React.createElement(App))
);
  </script>
</body>
</html>
